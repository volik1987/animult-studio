<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>АниМульт Студия</title>
<meta name="description" content="Создавай аниме-персонажей, расставляй их по локациям, делай кадры и собирай из них мультики со звуком.">
<meta name="theme-color" content="#2a1640">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АниМульт">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ===== Главная ===== -->
<section id="home" class="screen active">
  <div class="home-bg"></div>
  <div class="home-in">
    <img class="hero" src="img/hero.jpg" alt="">
    <h1>АниМульт <span>Студия</span></h1>
    <p class="sub">Создай героя → поставь в сцену → сделай кадры → собери мультик</p>
    <div class="home-cards">
      <button class="hcard c1" data-go="chars"><b>👗</b><span>Персонажи</span><small>создать и одеть</small></button>
      <button class="hcard c2" data-go="studio"><b>📸</b><span>Студия</span><small>сцены и фото</small></button>
      <button class="hcard c3" data-go="montage"><b>🎬</b><span>Монтаж</span><small>собрать мультик</small></button>
    </div>
    <button class="link" id="installBtn" hidden>📲 Установить на телефон</button>
  </div>
</section>

<!-- ===== Персонажи ===== -->
<section id="chars" class="screen">
  <header class="bar">
    <button class="ib" data-go="home" title="Домой">⌂</button>
    <h2>Персонажи</h2>
    <button class="btn" id="charNew">＋ Новый</button>
    <button class="btn alt" id="charRandom">🎲</button>
  </header>
  <div class="char-grid" id="charGrid"></div>
</section>

<!-- ===== Редактор персонажа ===== -->
<section id="editor" class="screen">
  <header class="bar">
    <button class="ib" id="edBack" title="Назад">‹</button>
    <input id="edName" class="name-in" maxlength="24" placeholder="Имя">
    <button class="ib" id="edUndo" title="Отменить">↶</button>
    <button class="ib" id="edRandom" title="Случайно">🎲</button>
    <button class="btn" id="edSave">✓ Сохранить</button>
  </header>
  <div class="ed-body">
    <div class="ed-view">
      <div class="ed-stage" id="edStage"><div class="ed-svg" id="edSvg"></div><div class="joints" id="edJoints"></div></div>
      <div class="adj" id="edAdj"></div>
      <div class="ed-zoom">
        <button class="chip" data-zoom="full">Весь</button><button class="chip" data-zoom="head">Голова</button><button class="chip" data-zoom="face">Лицо</button>
      </div>
    </div>
    <div class="ed-panel">
      <nav class="tabs" id="edTabs"></nav>
      <div class="ed-secs" id="edSecs"></div>
    </div>
  </div>
</section>

<!-- ===== Студия ===== -->
<section id="studio" class="screen">
  <header class="bar">
    <button class="ib" data-go="home" title="Домой">⌂</button>
    <h2 class="hide-s">Студия</h2>
    <button class="chip" id="stAspect" title="Формат кадра">16:9</button>
    <button class="chip" id="stOnion" title="Показать прошлый кадр полупрозрачным">🧅 Калька</button>
    <span class="grow"></span>
    <button class="ib" id="stUndo" title="Отменить">↶</button>
    <button class="shot" id="stShot" title="Сделать фото">📸</button>
  </header>
  <div class="st-body">
    <div class="st-left">
      <div class="st-wrap" id="stWrap">
        <div class="stage" id="stage">
          <div class="world" id="world">
            <div class="bg" id="stBg"></div>
            <div class="objs" id="stObjs"></div>
            <img class="onion" id="stOnionImg" alt="">
          </div>
          <div class="sel" id="stSel"><i class="h-rot" title="Повернуть и изменить размер">⟳</i></div>
          <div class="joints" id="stJoints"></div>
          <div class="flash" id="stFlash"></div>
        </div>
      </div>
      <div class="strip" id="stStrip"></div>
    </div>
    <div class="st-panel">
      <nav class="tabs" id="stTabs">
        <button data-t="add" class="on">＋ Добавить</button>
        <button data-t="bg">🏞 Фон</button>
        <button data-t="obj">✋ Объект</button>
        <button data-t="pose">🤸 Поза</button>
        <button data-t="face">😊 Эмоция</button>
      </nav>
      <div class="st-secs" id="stSecs"></div>
    </div>
  </div>
</section>

<!-- ===== Монтаж ===== -->
<section id="montage" class="screen">
  <header class="bar">
    <button class="ib" data-go="home" title="Домой">⌂</button>
    <select id="mFilm" class="film-sel"></select>
    <button class="ib" id="mFilmMenu" title="Фильмы">⋯</button>
    <span class="grow"></span>
    <button class="btn" id="mExport">⬇ Видео</button>
  </header>
  <div class="m-body">
    <div class="m-top">
      <div class="m-player"><canvas id="mCanvas" width="1280" height="720"></canvas>
        <div class="m-empty" id="mEmpty">Добавь кадры снизу 👇<br><small>кадры появляются, когда ты фотографируешь в Студии</small></div>
      </div>
      <div class="m-ctrl">
        <button class="ib big" id="mPlay">▶</button>
        <span id="mTime">0:00 / 0:00</span>
        <label class="chk"><input type="checkbox" id="mLoop" checked> повтор</label>
        <label class="chk"><input type="checkbox" id="mFade"> плавно</label>
        <span class="grow"></span>
        <button class="chip" id="mZoomOut">−</button><button class="chip" id="mZoomIn">＋</button>
      </div>
    </div>
    <div class="tl" id="tl">
      <div class="tl-in" id="tlIn">
        <div class="tl-ruler" id="tlRuler"></div>
        <div class="tl-row tl-frames" id="tlFrames"></div>
        <div class="tl-row tl-music" id="tlMusic"></div>
        <div class="tl-row tl-sounds" id="tlSounds"></div>
        <div class="tl-head" id="tlHead"></div>
      </div>
    </div>
    <div class="m-panel">
      <nav class="tabs" id="mTabs">
        <button data-t="frames" class="on">🖼 Кадры</button>
        <button data-t="sel">✏️ Выбранное</button>
        <button data-t="sounds">🔊 Звуки</button>
        <button data-t="music">🎵 Музыка</button>
        <button data-t="set">⚙️ Темп</button>
      </nav>
      <div class="m-secs" id="mSecs"></div>
    </div>
  </div>
</section>

<!-- модалки -->
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAudio" accept="audio/*,video/mp4,.mp3,.m4a,.wav,.ogg,.aac" hidden>

<script src="js/db.js"></script>
<script src="js/char.js"></script>
<script src="js/app.js"></script>
<script src="js/editor.js"></script>
<script src="js/studio.js"></script>
<script src="js/montage.js"></script>
</body>
</html>
